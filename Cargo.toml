[package]
name = "rec"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/viewsogx/rec"

[dependencies]
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.54.1", features = ["full"] }
blake3 = "1.8.7"
toml = "1.2.1"
serde = "1.0.229"
serde_json = "1.0.154"
axum = "0.8.9"
nanoid = "0.5"
anyhow = "1.0.104"
hf = "0.6"
colored = "3.1.1"
zstd = "0.14.4"
dirs = "7.0.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
