[workspace]
resolver = "2"
members = ["rec-core", "rec-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/viewsogx/rec"


[workspace.dependencies]
rec-core = { path = "rec-core" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
